# Build and deploy the site to GitHub Pages (e.g. https://snap-tfdp.github.io/).
#
# Prerequisite: a repo named exactly <owner>.github.io (here: github.com/snap-tfdp/snap-tfdp.github.io).
# This workflow assumes the repo root IS this project (same files as SNAP-tFDP-online/).
#
# After first push: Repo → Settings → Pages → Build: GitHub Actions → save.

name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
